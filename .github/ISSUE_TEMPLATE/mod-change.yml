name: Mod Change
description: Roadmap card for tracking mod additions, removals, config changes and holds
title: "[MOD] "
labels: ["internal"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ This template is for **internal roadmap use only**, not bug reports or mod requests.

  - type: input
    id: mod_name
    attributes:
      label: Mod Name
      placeholder: "StoreTweals"
    validations:
      required: true

  - type: input
    id: thunderstore_link
    attributes:
      label: Thunderstore Link
      placeholder: "https://thunderstore.io/c/lethal-company/p/Author/ModName/"
    validations:
      required: false

  - type: input
    id: current_version
    attributes:
      label: Current Version in Pack
      placeholder: "1.0.0"
    validations:
      required: false

  - type: input
    id: latest_version
    attributes:
      label: Latest Available Version
      placeholder: "1.1.0"
    validations:
      required: false

  - type: dropdown
    id: action
    attributes:
      label: Action Type
      options:
        - "➕ Add"
        - "➖ Remove"
        - "⚙️ Config Change"
        - "📌 Version Pin (downgrade)"
        - "⏳ Awaiting Author Fix"
        - "⚔️ Conflict Hold"
    validations:
      required: true

  - type: input
    id: pack_version
    attributes:
      label: Target Pack Version
      description: Which pack release is this planned for?
      placeholder: "v82.0.0"
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this being added, removed, changed, or held?
      placeholder: "Author deprecated the mod"
    validations:
      required: true

  - type: input
    id: conflicts_with
    attributes:
      label: Conflicts With
      placeholder: "CustomPosters"
    validations:
      required: false

  - type: dropdown
    id: test_result
    attributes:
      label: Test Result
      options:
        - "Untested"
        - "✅ Pass"
        - "❌ Fail"
        - "⚠️ Conditional"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "🚨 Must Have"
        - "👍 Nice to Have"
        - "🕐 Low"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Re-check after mod hits v2.0, author said fix is coming this week"
    validations:
      required: false
