name: Discord Roadmap Notifications

on:
  issues:
    types: [opened, labeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:

      - name: To Add
        if: contains(github.event.issue.labels.*.name, 'to-add')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** added a new card\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nTo Add",
              "color": 5763719,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.created_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: To Remove
        if: contains(github.event.issue.labels.*.name, 'to-remove')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** marked a mod for removal\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nTo Remove",
              "color": 15158332,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Config Change
        if: contains(github.event.issue.labels.*.name, 'config-change')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** planned a config change\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nConfig Changes",
              "color": 16776960,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Testing
        if: contains(github.event.issue.labels.*.name, 'needs-testing')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** sent a mod to testing\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nTesting",
              "color": 16753920,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Awaiting Author Fix
        if: contains(github.event.issue.labels.*.name, 'broken')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** flagged a mod as broken\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nAwaiting Author Fix",
              "color": 16705372,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Conflict Hold
        if: contains(github.event.issue.labels.*.name, 'conflict')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** put a mod on conflict hold\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nConflict Hold",
              "color": 15105570,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Version Pinned
        if: contains(github.event.issue.labels.*.name, 'version-pinned')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** pinned a mod to an older version\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nVersion Pinned",
              "color": 10181046,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Released
        if: contains(github.event.issue.labels.*.name, 'released')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** shipped a change 🎉\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nReleased",
              "color": 5763719,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Backlog
        if: contains(github.event.issue.labels.*.name, 'backlog')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "description": "**${{ github.actor }}** added a mod to backlog\n\n**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**\n\n**Column**\nBacklog",
              "color": 9807270,
              "footer": {
                "text": "MoreBrutalLC-Plus • MBLC+ Roadmap"
              },
              "timestamp": "${{ github.event.issue.updated_at }}"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}
