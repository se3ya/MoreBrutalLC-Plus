# Default value: 1
Dropship item pickup delay time = 1

## If true, block item pickup whilst you are being teleported.
# Setting type: Boolean
# Default value: false
Enable teleporter item pickup block = true

## Removes the invisible bump left by landmines after exploding.
# Setting type: Boolean
# Default value: false
Remove landmine invisible bump = true

## If true, attempts to bypass the lag spike of the Jester when it starts to wind up for the first time in an instance by doing it at the start of the day.
# Setting type: Boolean
# Default value: false
Jester Warmup = false

## If true, removes the 250 fps cap.
# Setting type: Boolean
# Default value: false
Uncap FPS = false

