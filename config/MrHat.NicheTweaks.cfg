# Default value: 
Grabbable to enemies item blacklist = 

## If true, gives the Radmech/Old Bird enemies a larger hitbox, mainly for use with mods where they are no longer immortal. However, as an unavoidable consequence, they can now grab you far easier, making them more difficult. Can be used to increase their lethality as well.
# Setting type: Boolean
# Default value: false
Give Radmechs a larger hit collider = false

## If true, resizes Butler's NavMeshAgent obstacle avoidance radius from 1.6 to 1.4 to help them fit through tighter spaces and open doors properly.
# Setting type: Boolean
# Default value: false
Lower size of Butler obstacle avoidance = false

## If true, disables the utility slot on the HUD and prevents items from using the utility slot.
# Setting type: Boolean
# Default value: false
Disable utility slot = true

## If true, displays the 'No one can hear you' popup when sending a chat message when everyone is dead.
# Setting type: Boolean
# Default value: false
Prevent check dead players cheese = false

[QoL]

## If true, enables the global voice volume slider in the player list.
# Setting type: Boolean
# Default value: false
Enable global voice volume slider = true

## If true, enables player volume saving. Works with global volume slider.
# Setting type: Boolean
# Default value: false
Enable player volume saving = false

## If true, adds a short delay to items dropped by the dropship before they can be grabbed.
