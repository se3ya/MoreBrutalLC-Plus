[Audio]

## If true, silences the ear ringing audio from shotgun blasts.
# Setting type: Boolean
# Default value: false
Silence ear ringing audio = false

## If true, silences live lightning static that plays from a conductive item being targeted when entering the facility.
# Setting type: Boolean
# Default value: false
Silence lightning static audio = false

[Decals]

## If true, breaks the decal draw distance and causes decals to always be rendered. Will impact performance, not recommended without LethalSponge.
# Setting type: Boolean
# Default value: false
Enable decal draw distance override = true

## If true, overrides the number of footprint decals allowed to exist.
# Setting type: Boolean
# Default value: false
Enable footprint pool override = false

## Number of footprints that are allowed to be present before the oldest footprints start culling visually. Increasing this will impact performance.
# Setting type: Int32
# Default value: 250
Footprint pool size = 250

## Enable blood effects when players take damage.
# Setting type: Boolean
# Default value: false
Enable player blood effects = true

## Minimum damage before blood splatter appears.
# Setting type: Int32
# Default value: 5
Minimum damage for blood = 5

## Number of blood splatters a player takes damage.
# Setting type: Int32
# Default value: 3
Blood amount = 3

## Size of blood splats created by players taking damage.
# Setting type: Single
# Default value: 3
BloodDecalSize = 8

[Gameplay]

## If true, prevents hoarder bugs from trying to pick up man eaters
# Setting type: Boolean
# Default value: false
Fix hoarder bug trying to grab man eater = true

## If true, enables grabbable to enemies item blacklist
# Setting type: Boolean
# Default value: false
Enable grabbable to enemies item blacklist = false

## Uses itemProperties name, separated by commas. E.g. 'Big bolt,Large axle,Bowl of Apples'
