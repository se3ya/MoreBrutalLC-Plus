# Setting type: String
# Default value: EYELESS DOG;;Scientific name: Leo caecus;A large mammal of the family Saeptivus. They are social, hunting in very large packs. They have also been called \"breathing lions\" for their recognizable sound and large mouths. They are endurance hunters and attempt to make up for their lack of sight with their sense of hearing. It\'s a popular myth that they often mistake the sounds of their own kind for prey, entering fights within their own packs.;;Their behaviour is unique from other pack animals in their tendency to spread out far to cover distance. When an eyeless dog has found prey, it roars to alert others in the near vicinity, who will also sound the alarm, sometimes resulting in a kind of chain reaction. Eyeless dogs can be dangerous in swarms. However, they are characteristically clumsy, taking guesses at their prey\'s exact location which are often incorrect. 
