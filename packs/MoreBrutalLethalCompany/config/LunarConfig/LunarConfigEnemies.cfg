# Setting type: String
# Default value: Backwater Gunkfish;;Sigurd\'s danger level: 0% but these little goopy goblins wont leave me ALONE;;Scientific name: Infectum linteum;;The Backwater Gunkfish is a type of Gunkfish of the family Mobulidae. Unlike the other types of Gunkfish, the Backwater Gunkfish spends most of its time on land. It can inhabit any damp, warm space where a water source is present. Its body is fat, flat, squishy and gelatinous, the width of a doormat. Its tail, slightly harder than the rest of its soft body, can range from 2-3 feet in length. When stressed, its tail is often curled up over its head to position for firing mucus or to shake and rattle as a deterrent.;;The Backwater Gunkfish feeds off organic material on surfaces, and for this reason, it is found most often around polluted water, swamps, or dirty sewers. When frightened, the Gunkfish can use an opening in its tail to release a burst of a thick, green mucus mixed with saliva to defend itself; the Backwater Gunkfish keeps an especially large \"reserve\" for emergency situations and can squirt multiple times. When needed, it uses part of this extra reserve to excrete from its body, increasing its mobility on land.;;The Backwater Gunkfish is harmless and is considered a natural cleaner of its preferred environments. Its mucus is a disinfectant; though it is not safe or healthy to consume, it is unlikely to cause major harm if it enters the body through the eyes or nose. Its smell is often described as a mix of vinegar and lard, and it is slightly warm when freshly excreted.;;Though not directly harmful, the Backwater Gunkfish is often considered a notorious pest to water treatment facilities and petroleum refineries. The gunkfish itself is evasive, capable of fitting itself into very small holes and pipes, and its mucus is arduous to remove once it has hardened, forming a substance comparable to ice. For all these reasons, the Backwater Gunkfish has lead to many accidents and should be taken seriously. Today, pest removal services are well-accustomed to safe Gunkfish removal and relocation operations, and there are many affordable options if you believe there is one in the area. The best way to prevent a Gunkfish infestation is to keep your environment clean and dry and to close off any access to standing water.;;;;
