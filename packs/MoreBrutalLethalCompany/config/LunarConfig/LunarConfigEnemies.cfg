away slowly and scan the forest for its bright, yellow eyes. When approaching, the Feiopar will typically give itself away with a brief, low purring. If this sound has already gone silent, the Feiopar may be within a dangerous distance. At very close proximity, eye contact with the Feiopar can actually have an adverse effect and persuade the Feiopar to pounce. This is why it\'s always recommended to keep non-lethal self defense such as bear spray on hand. If an encounter with the Feiopar has become violent, onlookers should stay clear and immediately seek medical aid for those involved, as attacks are often short-lived.;;;

