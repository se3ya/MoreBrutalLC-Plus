# Default value: Feiopar;;Scientific name: Felis arborum;;The Feiopar is a large mammal of the family Saeptivus. They typically stand at 5 feet tall. Of all species in this family, they most resemble their ancestor felines, though they differentiate themselves with their bony backs and long necks. Their tails are also twice the length of other species, commonly thought to support their enhanced climbing abilities, which they put to use when threatened. Feiopars are a recent discovery exclusive to the Green Witches--Vow, March, and Adamance.;;Their personalities are very timid yet curious. Although they may appear often to travelers and campers--seated low in the dense brush--they are rarely dangerous, and even their attacks are rarely fatal. There are no recorded deaths attributed to Feiopars. Hikers and explorers have linked the Feiopar to multiple urban legends of the past and rumor the Feiopar to be behind many disappearances, specifically on Vow. However, these rumors are unfounded. The Feiopar is a vital regulator of these ecosystems and is only curious about the new visitors of its territory. So if you are planning on a trip to the remote and scenic Vow, you might want to learn some do\'s and don\'ts about your small, saeptival friend!;;First of all: never hike alone. It\'s always good to have a buddy to watch your back, and Feiopars are intimidated by groups. And of course, never leave food out where it will attract prey and predators alike. Always keep your food in sealed containers. Side note: recent studies have indicated Feiopars are somewhat agitated by the color orange and high-visibility markings, however these have not been well-established.;;If you do encounter a Feiopar, do not panic. Pick up small children and stay calm. Speak in a low voice, make yourself look as big as possible, and maintain direct eye contact. Unlike most predators, maintaining direct eye contact with the Feiopar is an essential deterrence. If you cannot locate the Feiopar, back away slowly and scan the forest for its bright, yellow eyes. When approaching, the Feiopar will typically give itself away with a brief, low purring. If this sound has already gone silent, the Feiopar may be within a dangerous distance. At very close proximity, eye contact with the Feiopar can actually have an adverse effect and persuade the Feiopar to pounce. This is why it\'s always recommended to keep non-lethal self defense such as bear spray on hand. If an encounter with the Feiopar has become violent, onlookers should stay clear and immediately seek medical aid for those involved, as attacks are often short-lived.;;;
