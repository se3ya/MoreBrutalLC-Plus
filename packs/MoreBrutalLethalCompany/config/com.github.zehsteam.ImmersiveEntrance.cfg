[Portal]

## Enable portals!
# Setting type: Boolean
# Default value: true
Enabled = true

## The distance in meters the player needs to be within a portal for it to render.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 50
ActivationRange = 50

## If enabled, will temporarily disable the CullFactory mod when the interior is being rendered by a portal camera.
# Setting type: Boolean
# Default value: true
OverrideCullFactory = true

PixelResolution = PlayerCamera

OutsideViewDistance = 250

InsideViewDistance = 50

[Portal Graphics]

## The rendering pixel resolution of portals.
## PlayerCamera = Automatically adjusts to the player camera's rendering resolution.
## Default = 860x520.
## Performance = 620x364.
## UltraPerformance = 400x260.
## Retro = 186x104.
# Setting type: PixelResolutionType
# Default value: PlayerCamera
# Acceptable values: PlayerCamera, Default, Performance, UltraPerformance, Retro
PixelResolution = PlayerCamera

## The distance you can see through an outside portal.
# Setting type: Single
# Default value: 250
# Acceptable value range: From 0.06 to 250
OutsideViewDistance = 250

## The distance you can see through an inside portal.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 0.06 to 100
InsideViewDistance = 50

## Enable the rendering of fog.
# Setting type: Boolean
# Default value: true
FogEnabled = true

## Enable the rendering of weather effects.
# Setting type: Boolean
# Default value: true
WeatherEffectsEnabled = true

## Enable custom passes to render. This applies the Lethal Company signature shading to everything being viewed.
# Setting type: Boolean
# Default value: true
CustomPassEnabled = true

