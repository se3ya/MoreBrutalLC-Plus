[Other]

## This value helps calculating the spawn rarity, the rarity is calculated by the credit cost of the shop item. 
## This caps the maximum cost of an item and setting it as min spawn rarity if it is the same or higher than this value. 
## The more an item cost, the less spawn chance/spawn rarity it has.
# Setting type: Single
# Default value: 400
Max value to calculate rarity = 400

## List of items that are barred from registering as scrap/remnant item. 
## These default items are there to avoid adding scrap that are left out of the vanilla version, don't work, or cause crashes. 
## To add more names to the list, be sure to add a comma between names.
# Setting type: String
# Default value: Clipboard,StickyNote,Binoculars,MapDevice,Key,Error
Item list banned from registering as scrap = Clipboard,StickyNote,Binoculars,MapDevice,Key,Error,Phonebook Clipboard,Clipboard Phonebook,NightVisionItem,Catfood,eliteflashlightitem,itembattery,Handgrenade,Double-Barreled Shotgun,Double-BarreledShotgunItem,Doublebarreledshotgun,Shell,ShotgunShellItem,Battery,itembattery,Cat Food,CatFoodItem,Catfood,Elite-flashlight,EliteFlashlightItem,Eliteflashlight,Motion tracker,MotionTrackerItem,Motiontracker

## In here you can add scrap items to be treated as remnant items, to spawn bodies on and to randomize batteries. 
## To add more names to the list, be sure to add a comma between names.
# Setting type: String
# Default value: Example scrap,Scrap-example
Scrap item list to be used as remnant items = Example scrap,Scrap-example

## Make the beltbag item able to store remnant items. You can disable this feature to make other mods for the beltbag item more compatible.
# Setting type: Boolean
# Default value: true
Beltbag can store remnant items = true

## Due the spawning of remnnant items and bodies separately the end round score is not accurate, this feature fixes this issue.
# Setting type: Boolean
# Default value: true
Use end of round score fix = true

## List of Remnant items that are barred from the utility slot. 
## These default items are vanilla shop items that are banned from the utility slot.
# Setting type: String
# Default value: Shovel,example
Remnant item list banned from the utility slot = Shovel,example

