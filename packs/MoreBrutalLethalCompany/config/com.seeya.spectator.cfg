## Settings file was created by plugin Spectator v1.0.0
## Plugin GUID: com.seeya.spectator

[Camera]

## Automatically uses first person indoors (in facility, ship) and third person outdoors while spectating.
## 
## Press P to manually cycle camera modes; this manual override stays active until target/context changes.
# Setting type: Boolean
# Default value: true
AutoCameraByContext = true

## Include shoulder-cam mode in the P camera mode cycle.
# Setting type: Boolean
# Default value: true
EnableShoulderCam = true

## Shoulder-cam horizontal offset relative to the spectated player's camera direction. Positive is right shoulder.
# Setting type: Single
# Default value: 0.34
ShoulderCamHorizontalOffset = 0.34

## Shoulder-cam vertical offset relative to the spectated player's camera direction.
# Setting type: Single
# Default value: -0.05
ShoulderCamVerticalOffset = -0.05

## Shoulder-cam forward offset relative to the spectated player's camera direction. Negative moves camera back.
# Setting type: Single
# Default value: -0.28
ShoulderCamForwardOffset = -0.28

[FirstPerson]

## Include first-person mode in the P camera mode cycle.
# Setting type: Boolean
# Default value: true
Enabled = true

## Automatically enter first-person view when you die.
# Setting type: Boolean
# Default value: false
DefaultToFirstPerson = false

## When you die, start by spectating your own dead body in first person instead of auto-locking to an alive player.
# Setting type: Boolean
# Default value: false
StartAtDeadBodyFirstPerson = false

[Freecam]

## Allow toggling freecam while dead spectating with G.
# Setting type: Boolean
# Default value: true
Enabled = true

## Starting movement speed for freecam.
# Setting type: Single
# Default value: 7
# Acceptable value range: From 0,1 to 100
DefaultSpeed = 7

## Minimum freecam movement speed after scroll adjustment.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,1 to 100
MinSpeed = 2

## Maximum freecam movement speed after scroll adjustment.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 0,1 to 200
MaxSpeed = 25

## How much each scroll step changes freecam speed.
# Setting type: Single
# Default value: 1.25
# Acceptable value range: From 0,05 to 20
SpeedStep = 1.25

## Speed multiplier while holding Sprint in freecam.
# Setting type: Single
# Default value: 3.5
# Acceptable value range: From 1 to 20
SprintMultiplier = 3.5

## Sphere-cast radius used by freecam collision.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0,01 to 2
CollisionRadius = 0.15

## Maximum distance freecam can move from where it was toggled on. Set to 0 to disable bounds.
# Setting type: Single
# Default value: 120
# Acceptable value range: From 0 to 2000
MaxDistanceFromOrigin = 120

[HUD]

## Show the current time while spectating.
# Setting type: Boolean
# Default value: true
ShowClock = true

## Allow dead players to text-chat with each other. Also shows alive player chat if you are spectating them or they are nearby/on a walkie-talkie.
# Setting type: Boolean
# Default value: true
EnableDeadChat = true

[NightVision]

## Allow toggling night vision while spectating by pressing N.
# Setting type: Boolean
# Default value: true
Enabled = true

## Brightness of the night vision light.
# Setting type: Single
# Default value: 2000
# Acceptable value range: From 100 to 4500
Intensity = 2000

[Zoom]

## Allow zooming in/out with the mouse wheel while spectating.
# Setting type: Boolean
# Default value: true
Enabled = true

## How fast scrolling moves the camera.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0,05 to 1
Speed = 0.4

## Closest the camera can zoom in (metres).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 5
MinDistance = 1

## Furthest the camera can zoom out (metres).
# Setting type: Single
# Default value: 7
# Acceptable value range: From 2 to 15
MaxDistance = 7

## Starting zoom distance each time you die.
# Setting type: Single
# Default value: 1.4
# Acceptable value range: From 2 to 14
DefaultDistance = 2

