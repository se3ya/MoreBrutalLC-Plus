[Constellation: ARC-913]

## Enable custom unlock conditions for this constellation.
# Setting type: Boolean
# Default value: false
Enabled = true

## How active conditions are combined. Any requires one active condition to pass. All requires every active condition to pass.
# Setting type: String
# Default value: Any
# Acceptable values: Any, All
MatchMode = Any

## Unlock when the quota count reaches this value. Set to 0 to disable this condition.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 1000
RequiredQuotaCount = 1

## Unlock when every moon in this comma-separated list has been visited at least once. Leave empty to disable this condition.
# Setting type: String
# Default value: 
RequiredVisitedMoons = 

## Unlock when at least this many different moons have been visited. Set to 0 to disable this condition.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 1000
RequiredUniqueMoonVisits = 4

## Requires DawnLib. Unlock when every bestiary entry in this comma-separated list has been read at least once. Leave empty to disable this condition. Without DawnLib this condition will never pass.
# Setting type: String
# Default value: 
RequiredBestiaryEntries = 

## Requires DawnLib. Unlock when every story log in this comma-separated list has been read at least once. Leave empty to disable this condition. Without DawnLib this condition will never pass.
# Setting type: String
# Default value: 
RequiredStoryLogs = 

## When enabled, the constellation may unlock even if its default moon is still story-locked by another source.
# Setting type: Boolean
# Default value: false
IgnoreDefaultMoonStoryLock = true

