## Settings file was created by plugin LethalPresents v2.0.4
## Plugin GUID: LethalPresents

[Extra]

## Enables increased logging to help with debugging
# Setting type: Boolean
# Default value: true
IncreasedLogging = true

## If enabled, the spawn chance will be unpredictable and will vary.
# Setting type: Boolean
# Default value: false
FateMode = false

## Workadound against some mods (if you find such mods - please complain to their authors about it) replacing level.Enemies entries with cloned enemies without updating their names.
# Setting type: Boolean
# Default value: false
CloneWorkaround = false

## Allow spawning inside enemies when outside the building. CAN CAUSE LAG WITHOUT PROPER AI MOD
# Setting type: Boolean
# Default value: true
AllowInsideSpawnOutside = true

## Allow spawning outside enemies when inside the building. CAN CAUSE LAG WITHOUT PROPER AI MOD
# Setting type: Boolean
# Default value: true
AllowOutsideSpawnInside = true

## Allow spawning enemies when opening presents inside the ship. Unkillable enemies may not be despawnable.
# Setting type: Boolean
# Default value: false
AllowShipSpawns = false

[General]

## Chance of spawning an enemy when opening a present [0-100]
# Setting type: Int32
# Default value: 5
SpawnChance = 10

## Enemy blocklist separated by , and without whitespaces
# Setting type: String
# Default value: 
EnemyBlocklist = Baboon hawk,Blob,Centipede,Earth Leviathan,Emma,Girl,Hoarding bug,Masked,MouthDog,Nutcracker

## Turns blocklist into allowlist, blocklist must contain at least one inside and one outside enemy, use at your own risk
# Setting type: Boolean
# Default value: false
IsAllowlist = true

## Add mines to the spawn pool
# Setting type: Boolean
# Default value: true
ShouldSpawnMines = false

## Add turrets to the spawn pool
# Setting type: Boolean
# Default value: true
ShouldSpawnTurrets = false

## Add spike roof traps to the spawn pool
# Setting type: Boolean
# Default value: true
ShouldSpawnSpikeTrap = true

## List of moons to ignore present spawning events on, separated by comma. You can specify the moon with and without its numbers too
# Setting type: String
# Default value: 
MoonsToIgnore = 

## Turns moon ignore list into allowlist
# Setting type: Boolean
# Default value: false
MoonListIsAllowlist = false

