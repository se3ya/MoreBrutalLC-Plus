## Settings file was created by plugin QuotaOverhaul v2.0.0
## Plugin GUID: luciusoflegend.lethalcompany.quotaoverhaul

[Credit Penalties]

## When enabled, you will lose a fraction of your credits for every crew memeber that dies.  You can also enable dynamic mode, in which case the penalty is based on the ratio of dead players to alive players. 
## Vanilla: true
# Setting type: Boolean
# Default value: false
Enable = true

## When enabled, you also lose credits for dead players on Gordion/The Company. 
## Vanilla: true
# Setting type: Boolean
# Default value: false
Enable At The Company = false

## The fraction of your credits that you lose for each dead player.  Example:  Penalty Per Player = 20%, you have 1000 credits, 2 players die, you lose 400. 
## Values >= 0
# Setting type: Single
# Default value: 0.2
Penalty Per Player = 5

## Instead of calculating the penalty as a flat rate per dead player, Dynamic Mode calculates the penalty based on the portion of your crew that died.  This makes it more balanced for large crews.
## Vanilla: false
# Setting type: Boolean
# Default value: true
Dynamic Mode = false

## The penalty in the worst case scenario, all players dead and unrecovered. Any players still alive, and any bodies recovered (see Body Recovery Bonus) will reduce the penalty. 
## Values >= 0
# Setting type: Single
# Default value: 0.8
Dynamic Penalty Cap = 0.8

## If the penalty falls below this threshold, the penalty is set to 0. Increasing this value makes minor slip-ups more forgiving.  This applies to both the static and dynamic algorithms. 
## Values > 0
# Setting type: Single
# Default value: 0.2
Dynamic Penalty Threshold = 0.2

## How much of the penalty to forgive for recovering bodies. A higher value means a higher incentive to recover bodies.  Applies to both normal and dynamic modes. 
## Values between 0-100
# Setting type: Single
# Default value: 0.2
Body Recovery Bonus = 90

## The penalty that will be applied in the case of all players being dead.  A value <= 0 disables this feature.  This applies to either flat or dynamic mode.  Recovered bodies still reduce the penalty as normal.
# Setting type: Single
# Default value: 0
Team Wipe Penalty = 0

Penalty Percent Cap = 20

Penalty Percent Threshold = 5

