[General]

## Levels to disable weather overrides in. Weather overrides are a feature implemented by moon devs to force certain weathers to appear, regardless of anything else. This config attempts to disable those effects. Format is a list of moon names seperated by ; e.g. Soreal;Penumbra; etc. etc.
# Setting type: String
# Default value: 
Level Weather Override Whitelist = 

## When enabled, before any injections from this mod happen, all vanilla weather (including Clear weather!) is unregistered from every moon, ensuring that only vanilla weathers on moon will be ones you inject yourself. This is mostly for if you want to remove clear weather from moons, as you can already prevent a weather appearing on a moon by just blacklisting it in WeatherRegistry.
# Setting type: Boolean
# Default value: false
Unregister All Vanilla Weathers = false

